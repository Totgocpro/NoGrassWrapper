name: Build

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  build:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        arch: [amd64]
    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-go@v5
        with:
          go-version: '1.26'
          cache: true

      - name: Build
        run: |
          VERSION="$(git describe --tags 2>/dev/null || echo dev)-$(git rev-parse --short HEAD)"
          go build -ldflags="-X main.Version=$VERSION" -o "nograsswrapper${{ matrix.os == 'windows-latest' && '.exe' || '' }}" ./src/

      - name: Vet
        run: go vet ./src/

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: nograsswrapper-${{ matrix.os }}-${{ matrix.arch }}
          path: nograsswrapper*
