name: Build

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  build:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        arch: [amd64]
    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-go@v5
        with:
          go-version: '1.26'
          cache: true

      - name: Install system deps (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq libayatana-appindicator3-dev libgtk-3-dev libx11-dev

      - name: Build
        shell: bash
        run: |
          VERSION="$(git describe --tags 2>/dev/null || echo dev)-$(git rev-parse --short HEAD)"
          LDFLAGS="-X main.Version=$VERSION"
          if [ "${{ runner.os }}" = "Windows" ]; then
            LDFLAGS="-H windowsgui -X main.Version=$VERSION"
          fi
          CGO_ENABLED=${{ runner.os == 'Windows' && '0' || '1' }} \
            go build -ldflags="$LDFLAGS" \
            -o "nograsswrapper${{ runner.os == 'Windows' && '.exe' || '' }}" ./src/

      - name: Vet
        run: go vet ./src/

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: nograsswrapper-${{ matrix.os }}-${{ matrix.arch }}
          path: nograsswrapper*
