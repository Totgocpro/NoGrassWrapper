name: Release

on:
  push:
    tags:
      - 'v*'
    branches:
      - main
      - master
  workflow_dispatch:
    inputs:
      version_override:
        description: 'Override version string (default: git describe)'
        default: ''
        type: string

permissions:
  contents: write

jobs:
  icon:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Generate icon PNG from SVG
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq librsvg2-bin
          rsvg-convert -w 64 -h 64 assets/Icon.svg > src/assets/Icon.png
      - name: Upload icon PNG
        uses: actions/upload-artifact@v4
        with:
          name: icon-png
          path: src/assets/Icon.png

  build:
    needs: icon
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            goos: linux
            goarch: amd64
            ext: ""
          - os: windows-latest
            goos: windows
            goarch: amd64
            ext: ".exe"
          - os: macos-latest
            goos: darwin
            goarch: amd64
            ext: ""
          - os: macos-latest
            goos: darwin
            goarch: arm64
            ext: ""
    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-go@v5
        with:
          go-version: '1.26'
          cache: true

      - name: Download icon PNG
        uses: actions/download-artifact@v4
        with:
          name: icon-png
          path: src/assets/

      - name: Derive version
        id: version
        shell: bash
        run: |
          if [ -n "${{ inputs.version_override }}" ]; then
            VERSION="${{ inputs.version_override }}"
          elif [[ "${{ github.ref }}" == refs/tags/v* ]]; then
            VERSION="${{ github.ref_name }}"
          else
            VERSION="$(git describe --tags --always 2>/dev/null || echo dev)"
          fi
          # AppVersion must be clean (no hyphens) for Inno Setup
          APP_STRIP="${VERSION#v}"
          APP_CLEAN="${APP_STRIP%%-*}"
          echo "VERSION=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "APP_VERSION_STRIP=${APP_CLEAN}" >> "$GITHUB_OUTPUT"

      - name: Install system deps (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq libayatana-appindicator3-dev libgtk-3-dev libx11-dev

      - name: Build (${{ matrix.goos }}/${{ matrix.goarch }})
        shell: bash
        env:
          CGO_ENABLED: ${{ matrix.goos == 'windows' && '0' || '1' }}
        run: |
          VERSION="${{ steps.version.outputs.VERSION }}"
          LDFLAGS="-X main.Version=$VERSION"
          if [ "${{ matrix.goos }}" = "windows" ]; then
            LDFLAGS="-H windowsgui -X main.Version=$VERSION"
          fi
          GOOS=${{ matrix.goos }} GOARCH=${{ matrix.goarch }} \
            go build -ldflags="$LDFLAGS" \
            -o "nograsswrapper-${VERSION}-${{ matrix.goos }}-${{ matrix.goarch }}${{ matrix.ext }}" \
            ./src/

      - name: Build Windows installer (Windows only)
        if: matrix.goos == 'windows'
        shell: bash
        env:
          MSYS2_ARG_CONV_EXCL: "*"
        run: |
          VERSION="${{ steps.version.outputs.VERSION }}"
          APPVER="${{ steps.version.outputs.APP_VERSION_STRIP }}"
          cp "nograsswrapper-${VERSION}-windows-amd64.exe" nograsswrapper.exe
          iscc "/dMyAppVersion=${APPVER}" installer/windows.iss

      - name: Rename installer with version
        if: matrix.goos == 'windows'
        shell: bash
        run: |
          VERSION="${{ steps.version.outputs.VERSION }}"
          mv dist/NoGrassWrapper-Setup.exe "dist/NoGrassWrapper-Setup-${VERSION}.exe"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: binary-${{ matrix.goos }}-${{ matrix.goarch }}
          path: |
            nograsswrapper-*-${{ matrix.goos }}-${{ matrix.goarch }}${{ matrix.ext }}
            dist/NoGrassWrapper-Setup-*.exe

  release:
    if: startsWith(github.ref, 'refs/tags/')
    needs: build
    runs-on: ubuntu-latest

    steps:
      - name: Get version
        id: version
        shell: bash
        run: echo "VERSION=${{ github.ref_name }}" >> "$GITHUB_OUTPUT"

      - uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Collect binaries
        run: |
          mkdir release-assets
          find artifacts -type f -exec cp {} release-assets/ \;
          ls -la release-assets/

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          name: NoGrassWrapper ${{ steps.version.outputs.VERSION }}
          tag_name: ${{ steps.version.outputs.VERSION }}
          body: |
            ## NoGrassWrapper ${{ steps.version.outputs.VERSION }}

            ### 🖥️ Downloads

            | Platform | Architecture | File |
            |----------|-------------|------|
            | Linux    | amd64       | `nograsswrapper-${{ steps.version.outputs.VERSION }}-linux-amd64` |
            | Windows  | amd64       | `nograsswrapper-${{ steps.version.outputs.VERSION }}-windows-amd64.exe` |
            | macOS    | amd64       | `nograsswrapper-${{ steps.version.outputs.VERSION }}-darwin-amd64` |
            | macOS    | arm64       | `nograsswrapper-${{ steps.version.outputs.VERSION }}-darwin-arm64` |

            ### 📦 Installer (Windows)
            Download `NoGrassWrapper-Setup-${{ steps.version.outputs.VERSION }}.exe` from the assets below.

            ### 🆕 What's Changed
            See the commit log for details.
          draft: false
          prerelease: false
          files: release-assets/*
